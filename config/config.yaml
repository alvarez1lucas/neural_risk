mode: "development"

timeframes:
  short: 10
  medium: 30
  long: 100
  strategic: 1000

exchanges:
  primary: "binance"
  use_mock: true   # true = datos simulados (np.random), false = BinanceLoader real via ccxt
  timeframe: "1m"  # granularidad de vela a pedirle a Binance cuando use_mock=false
  credentials:
    api_key: "${BINANCE_API_KEY}"
    api_secret: "${BINANCE_API_SECRET}"
  assets: ["BTC", "ETH", "SOL", "AVAX", "ARB"]
  quote_currency: "USDT"

database:
  type: "sqlite"
  path: "./data/neural_risk.db"
  host: "${DB_HOST}"
  port: 5432
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  dbname: "neural_risk"

cache:
  backend: "redis"
  redis_host: "localhost"
  redis_port: 6379
  redis_db: 0
  data_ttl: 60
  model_ttl: 3600
  max_memory_mb: 1024

signals:
  long_threshold: 0.60
  short_threshold: -0.60
  min_confidence: 0.50
  sl_adaptive_threshold: 0.70
  fractional_kelly: 0.25
  max_position_size: 0.10
  base_staking_apy: 0.05
  staking_min_amount: 100   # NOTA: sin consumidor todavia (config muerto)

expert_evaluation:
  lookback_window: 100
  sortino_weight: 0.40
  win_rate_weight: 0.30
  profit_factor_weight: 0.20
  sharpe_weight: 0.10
  ideal_sortino: 2.0
  ideal_profit_factor: 2.0
  ideal_sharpe: 1.5

training:
  schedule: "0 0 * * *"
  train_test_split: 0.8
  validation_split: 0.1
  models:
    HMM:
      n_states: 3
      covariance_type: "full"
    XGBoost:
      n_estimators: 200
      max_depth: 6
      learning_rate: 0.1
    GARCH:
      p: 1
      q: 1
    LSTM:
      hidden_size: 64
      num_layers: 2
      dropout: 0.1
      learning_rate: 0.001
    Transformer:
      hidden_size: 64
      num_heads: 4
      num_layers: 2
      dropout: 0.1

cycle_timing:
  # NOTA: valores bajados TEMPORALMENTE para poder observar varios
  # ciclos en una sesión corta. Para uso real (o con datos reales de
  # Binance), volver a subir estos números -- ver el roadmap de
  # escalado gradual original: 300s -> 180s -> 120s -> 60s.
  data_fetcher_interval: 15
  engine_interval: 30
  executor_interval: 20
  portfolio_hedge_interval_hours: 24   # PortfolioHedgeOptimizer es costoso (Differential Evolution), corre 1x/dia por defecto

execution:
  order_type: "market"   # NOTA: sin consumidor real (executor siempre mockea market)
  max_orders_per_minute: 5
  max_daily_loss_pct: 0.05
  limit_price_deviation: 0.01   # NOTA: sin consumidor todavia (config muerto)
  max_retries: 3
  retry_delay_ms: 1000

monitoring:
  dashboard_refresh_interval: 30
  log_trades: true
  log_path: "./logs/trades.log"
  alerts:
    email_on_stop_loss: false
    email_on_large_loss: true
    large_loss_threshold: 1000
    telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
    telegram_chat_id: "${TELEGRAM_CHAT_ID}"

performance:
  n_workers: 4
  use_gpu: false
  batch_size: 32
  max_memory_gb: 8

logging:
  level: "INFO"
  format: "json"
  console_output: true
  file_output: true
  file_path: "./logs/neural_risk.log"

backtest:
  data_path: "./data/BTC_USD_data.csv"
  start_date: "2021-01-01"
  end_date: "2025-12-31"
  initial_capital: 100000
  slippage_pct: 0.001
  commission_pct: 0.001
  continue_on_error: true