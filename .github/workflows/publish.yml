name: publish

# Se publica en PyPI al crear un Release en GitHub. Usa "trusted publishing"
# (OIDC): no hace falta guardar ningún token en el repo. Requiere configurar
# una vez el publisher en https://pypi.org/manage/project/neural-risk/settings/publishing/
# (owner: alvarez1lucas, repo: neural_risk, workflow: publish.yml, environment: pypi).

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" build
      - run: pytest
      # El tag del release tiene que coincidir con la versión del pyproject.
      - run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$VERSION"; exit 1; }
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
